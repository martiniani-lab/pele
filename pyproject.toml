[build-system]
requires = [
    "setuptools>=65",
    "wheel",
    "numpy>=1.24",
    "cython>=3",
    "cmake>=3.18",
    "meson",  # numpy>=2 f2py backend
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "pele"
version = "0.1.0"
description = "Python energy landscape explorer: global optimization, minimization, basins of attraction"
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy",
    "networkx",
    "matplotlib",
    "sqlalchemy>=1.4,<2",
    "munkres",
    "pyro4",
    "future",
]

[project.optional-dependencies]
test = ["pytest"]
gui = ["pyqt5"]

[project.urls]
Homepage = "https://github.com/martiniani-lab/pele"
